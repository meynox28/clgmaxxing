name: Daily timetable

on:
  schedule:
    - cron: "30 1 * * 1-4,6"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python bot.py
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
